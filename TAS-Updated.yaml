      security:
        - Bearer: []
        - SessionId: []
  /api/v1/accounts/paymentreference:
    post:
      tags:
        - Payments
      summary: 🌐🔒 Create a payment reference for an account.
      description: Creates a payment reference linking an account, branch, and payment amount.
      operationId: CreatePaymentReference
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.CreatePaymentRequest'
          text/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.CreatePaymentRequest'
          application/*+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.CreatePaymentRequest'
      responses:
        '200':
          description: OK
