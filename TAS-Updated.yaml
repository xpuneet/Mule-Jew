  /api/v1/accounts/paymentreference/{paymentReference}:
    get:
      tags:
        - Payments
      summary: 🌐🔒 Get payment reference details by reference ID
      description: Returns payment details including account, amount, and status for the given reference.
      operationId: GetPaymentReference
      parameters:
        - name: paymentReference
          in: path
          description: A paymentReference must be a GUID
          required: true
          schema:
            pattern: ^\S+$
            type: string
            format: uuid
          example: 1E1944CF-18CC-452B-8028-E007E2F5A2B7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.PaymentResponse'
        '400':
