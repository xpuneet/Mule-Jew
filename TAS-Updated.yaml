  /api/v1/accounts/documents/download/{token}:
    get:
      tags:
        - Transactions
      summary: 🌐🔒 Download an invoice or credit note file using a token.
      description: Returns the document file as a binary download. Token is obtained from the download-request endpoint and expires after a configured period.
      operationId: DownloadDocument
      parameters:
        - name: token
          in: path
          description: A token must be a GUID
          required: true
          schema:
            pattern: ^\S+$
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.DocumentDownloadResponse'
              examples:
                PDF document:
                  summary: The document is ready and returned as binary content (application/pdf).
                  value:
                    fileName: 1234-XYZ-ABC.pdf
                    contentType: application/pdf
                File not ready:
                  summary: The document is still being prepared for download.
                  value:
                    message: The file is not ready for download yet. Please try again later.
                File not found:
                  summary: The download token has expired or the document does not exist.
                  value:
                    message: The token has expired. Please create a new request for token.
            application/pdf:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.DocumentDownloadResponse'
              examples:
                PDF document:
                  summary: The document is ready and returned as binary content (application/pdf).
                  value:
                    fileName: 1234-XYZ-ABC.pdf
                    contentType: application/pdf
                File not ready:
                  summary: The document is still being prepared for download.
                  value:
                    message: The file is not ready for download yet. Please try again later.
                File not found:
                  summary: The download token has expired or the document does not exist.
                  value:
                    message: The token has expired. Please create a new request for token.
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.NotFoundResponse'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
      security:
        - Bearer: []
        - SessionId: []
