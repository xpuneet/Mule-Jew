openapi: 3.0.4
info:
  title: STUK.TradeAccountService.WebApi
  description: "Demonstrates API endpoints for STUK.TradeAccountService.WebApi.\r\n\r\n- 🌐 External (consumer-facing / session-based)\r\n- 🔒 Internal (server-to-server / private)"
  version: '1.0'
paths:
  /api/v1/accounts/{accountCode}:
    get:
      tags:
        - Accounts
      summary: 🌐🔒 Get account details by account code.
      description: Returns full account details including contacts, addresses, and payment profile for the given account code.
      operationId: GetAccount
      parameters:
        - name: accountCode
          in: path
          description: Must contain at least one letter or number. Length of accountCode must be 1-25
          required: true
          schema:
            maxLength: 25
            minLength: 1
            pattern: ^(?=.*[a-zA-Z0-9]).+$
            type: string
          example: HXTR267
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.AccountResponse'
              example:
                account:
                  accountCode: HXTR267
                  name: Kerridge CS
                  parentAccountCode: A0001
                  accountType: Credit
                  accountLevel: L
                  owningBranch: '4050'
                  owningBrand: JCV
                  contacts:
                    - type: Primary
                      name: Fred Jones
                      phone: +44 1488 662000
                      email: sales@kerridgecs.com
                  addresses:
                    - type: primary
                      lines:
                        - Unit 5
                        - Hungerford Trading Estate
                      town: Hungerford
                      postCode: RG17 0YU
                  paymentProfile:
                    paymentOnCredit: true
                    paymentOnCard: false
                    accountOnStop: false
                    creditAttributes:
                      - name: invoiceMethod
                        code: 'N'
                        description: Normal
                    creditStatus:
                      - name: creditLimit
                        amount: 5000
                        lastUpdatedDate: '2021-03-31T00:00:00'
                  extensionAttributes:
                    - Status: Active
                      Amount: 100.5
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.NotFoundResponse'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
      security:
        - Bearer: []
        - SessionId: []
  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: 🌐 Search accounts linked to the authenticated user's session.
      description: Returns paginated list of accounts for a user.
      operationId: SearchAccount
      parameters:
        - name: X-Session-Id
          in: header
          schema:
            type: string
        - name: pageNumber
          in: query
          description: The number of page
          schema:
            type: integer
            format: int32
            default: 1
          example: 1
        - name: pageSize
          in: query
          description: Number of items per page. Allowed range 1-50
          schema:
            type: integer
            format: int32
            default: 10
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.AccountSearchResponse'
              example:
                pages:
                  pageNumber: 1
                  lastPage: false
                  pageSize: 10
                accounts:
                  - accountCode: HXTR267
                    name: Kerridge CS
                    parentAccountCode: A0001
                    accountType: Credit
                    accountLevel: L
                    owningBranch: '4050'
                    owningBrand: JCV
                    contacts:
                      - type: Primary
                        name: Fred Jones
                        phone: +44 1488 662000
                        email: sales@kerridgecs.com
                    addresses:
                      - type: primary
                        lines:
                          - Unit 5
                          - Hungerford Trading Estate
                        town: Hungerford
                        postCode: RG17 0YU
                    paymentProfile:
                      paymentOnCredit: true
                      paymentOnCard: false
                      accountOnStop: false
                      creditAttributes: []
                      creditStatus: []
                    extensionAttributes:
                      - Status: Active
                        Amount: 100.5
                  - accountCode: BXTR100
                    name: Builder Supplies Ltd
                    parentAccountCode: A0001
                    accountType: Cash
                    accountLevel: S
                    owningBranch: '3020'
                    owningBrand: PTS
                    contacts: []
                    addresses:
                      - type: primary
                        lines:
                          - 10 High Street
                        town: Manchester
                        postCode: M1 1AA
                    paymentProfile:
                      paymentOnCredit: false
                      paymentOnCard: true
                      accountOnStop: false
                      creditAttributes: []
                      creditStatus: []
                    extensionAttributes:
                      - Status: Active
                        Amount: 100.5
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.NotFoundResponse'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
      security:
        - SessionId: []
