  /api/v1/accounts/{accountCode}/overview:
    get:
      tags:
        - Accounts
      summary: 🌐 Get high-level account details by account code.
      description: Returns account, invoice, creditnote, statement, preferred branch and creditLimit details for an account code.
      operationId: Overview
      parameters:
        - name: accountCode
          in: path
          description: Must contain at least one letter or number. Length of accountCode must be 1-25
          required: true
          schema:
            maxLength: 25
            minLength: 1
            pattern: ^(?=.*[a-zA-Z0-9]).+$
            type: string
          example: HXTR267
        - name: recentInvoicesLimit
          in: query
          description: Number of recent invoices returned. Allowed range 1-10
          schema:
            type: integer
            format: int32
            default: 5
          example: 5
        - name: recentCreditNotesLimit
          in: query
          description: Number of recent creditnotes returned. Allowed range 1-10
          schema:
            type: integer
            format: int32
            default: 5
          example: 5
        - name: recentStatementsLimit
          in: query
          description: Number of recent statements returned. Allowed range 1-12
          schema:
            type: integer
            format: int32
            default: 3
          example: 3
      responses:
        '200':
          description: Account, invoice, creditnote, statement, preferred branch and creditLimit details for an account code retrived.
        '400':
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.NotFoundResponse'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
      security:
        - SessionId: []
