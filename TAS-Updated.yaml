    put:
      tags:
        - Settlements
      summary: 🌐 Apply a transaction to a settlement
      description: Applies a transaction in full against the settlement. The settlement's total amount is recomputed. The caller must supply the current settlement ETag using `If-Match`. If the settlement has changed since that version was retrieved, the operation returns `412 Precondition Failed`. Rejected if the resulting amount would be less than zero, if the transaction is unavailable, or if the settlement is not in `DRAFT`.
      operationId: ApplyTransactionOnSettlement
      parameters:
        - name: X-Session-Id
          in: header
          schema:
            type: string
        - name: ifMatch
          in: query
          description: ETag of the settlement version being modified. The operation fails with 412 if the settlement has changed since this ETag was obtained.
          schema:
            type: string
        - name: accountCode
          in: path
          description: Must contain at least one letter or number. Length of accountCode must be 1-25
          required: true
          schema:
            type: string
          example: HXTR267
        - name: settlementId
          in: path
          description: Settlement Id must be GUID
          required: true
          schema:
            type: string
          example: BDA0B711-D215-45BD-AFDD-06F79089EADD
        - name: transactionId
          in: path
          description: Transaction Id must be GUID
          required: true
          schema:
            type: string
          example: BDA0B711-D215-45BD-AFDD-06F79089EADD
        - name: _view
          in: query
          schema:
            allOf:
              - $ref: '#/components/schemas/STUK.TradeAccountService.WebApi.RequestParams.SettlementRouteParams.TemplateView'
          example: CDM
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.TradeAccountService.Common.Contracts.Models.SettlementSummaryCDM'
