      description: Returns account validation result including postcode and brand validity.
      operationId: ValidateAccount
      parameters:
        - name: accountCode
          in: query
          description: Must contain at least one letter or number. allowed range 1-50
          schema:
            type: string
          example: HXTR267
        - name: postCode
          in: query
          description: Unique post code is required, allowed range 1-10
          schema:
            type: string
          example: M1 1AA
        - name: brand
          in: query
          description: Unique brand code is required, allowed range 1-50
          schema:
            type: string
          example: Jew
      responses:
