  /v1/payments/methods:
    get:
      tags:
        - Payment
      summary: 🌐 List payment options for a settlement
      description: Returns the payment options available to the customer for settling the specified settlement, composed from saved cards and the supported payment methods.
      operationId: GetPaymentMethods
      parameters:
