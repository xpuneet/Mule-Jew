  /v1/accounts/{accountCode}/payments/{settlementId}/submit:
    post:
      tags:
        - Payment
      summary: 🌐 Submit a settlement for payment
      description: ''
      operationId: SubmitSettlement
      parameters:
        - name: X-Session-Id
          in: header
          schema:
            type: string
        - name: accountCode
          in: path
          description: Must contain at least one letter or number. Length of accountCode must be 1-25
          required: true
          schema:
            type: string
          example: HXTR267
        - name: settlementId
          in: path
          description: Settlement Id must be GUID
          required: true
          schema:
            type: string
          example: BDA0B711-D215-45BD-AFDD-06F79089EADD
        - name: ifMatch
          in: query
          description: ETag of the settlement version being modified. The operation fails with 412 if the settlement has changed since this ETag was obtained.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.SettlementSubmitRequest'
            examples:
              Payment with new card but not saving it:
                value:
                  paymentMethodId: 112ed2a5-750e-47dc-a09e-855e60f22aff
                  card:
                    type: NEW
                    saveForFutureUse: false
              Payment with new card and save it:
                value:
                  paymentMethodId: 11c39af2-8ab6-41ec-a3e5-d90d8866de03
                  card:
                    type: NEW
                    saveForFutureUse: true
              Payment with existing card:
                value:
                  paymentMethodId: 1cbcbd2e-a30c-4ba9-bbe7-ac958ca8d5eb
                  card:
                    type: STORED
                    cardId: 96fbe3da-0147-4e2d-a147-05c45c56ff08
              Payment with Apple Pay:
                value:
                  paymentMethodId: 183e2e52-41a5-4c20-b4fb-56d78335f043
                  applePayToken:
                    paymentData: null
                    paymentMethod: null
                    transactionIdentifier: null
          text/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.SettlementSubmitRequest'
            examples:
              Payment with new card but not saving it:
                value:
                  paymentMethodId: 112ed2a5-750e-47dc-a09e-855e60f22aff
                  card:
                    type: NEW
                    saveForFutureUse: false
              Payment with new card and save it:
                value:
                  paymentMethodId: 11c39af2-8ab6-41ec-a3e5-d90d8866de03
                  card:
                    type: NEW
                    saveForFutureUse: true
              Payment with existing card:
                value:
                  paymentMethodId: 1cbcbd2e-a30c-4ba9-bbe7-ac958ca8d5eb
                  card:
                    type: STORED
                    cardId: 96fbe3da-0147-4e2d-a147-05c45c56ff08
              Payment with Apple Pay:
                value:
                  paymentMethodId: 183e2e52-41a5-4c20-b4fb-56d78335f043
                  applePayToken:
                    paymentData: null
                    paymentMethod: null
                    transactionIdentifier: null
          application/*+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.SettlementSubmitRequest'
            examples:
              Payment with new card but not saving it:
                value:
                  paymentMethodId: 112ed2a5-750e-47dc-a09e-855e60f22aff
                  card:
                    type: NEW
                    saveForFutureUse: false
              Payment with new card and save it:
                value:
                  paymentMethodId: 11c39af2-8ab6-41ec-a3e5-d90d8866de03
                  card:
                    type: NEW
                    saveForFutureUse: true
              Payment with existing card:
                value:
                  paymentMethodId: 1cbcbd2e-a30c-4ba9-bbe7-ac958ca8d5eb
                  card:
                    type: STORED
                    cardId: 96fbe3da-0147-4e2d-a147-05c45c56ff08
              Payment with Apple Pay:
                value:
                  paymentMethodId: 183e2e52-41a5-4c20-b4fb-56d78335f043
                  applePayToken:
                    paymentData: null
                    paymentMethod: null
                    transactionIdentifier: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.SubmitSettlementResponse'
              examples:
                Payment with card:
                  value:
                    paymentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    status: REQUIRES_ACTION
                    nextAction:
                      type: REDIRECT
                      url: https://smartpay/...
                Payment with apple_pay:
                  value:
                    paymentId: 0a0f3038-8cae-4c24-b7a5-2d06a0b2916f
                    status: Processing
                    nextAction: null
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
