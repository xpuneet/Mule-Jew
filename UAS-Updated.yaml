          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.PaymentMethodsResponse'
              example:
                - paymentMethodId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  methodName: CARD
                  methodType: CARD
                  displayOrder: 1
                - paymentMethodId: 7fa85f64-5717-4562-b3fc-2c963f66afa7
