openapi: 3.0.4
info:
  title: STUK.UserAccountService.WebApi
  description: "Demonstrates API endpoints for STUK.UserAccountService.WebApi.\r\n\r\n- 🌐 External (consumer-facing / session-based)\r\n- 🔒 Internal (server-to-server / private)"
  version: '1.0'
paths:
  /auth/v1/interactive-login:
    post:
      tags:
        - Auth
      parameters:
        - name: sourceName
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.LoginRequest'
          text/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.LoginRequest'
          application/*+json:
            schema:
              allOf:
                - $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.UserAccountService.Common.Contracts.Models.InteractiveLoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.ApiErrorResponse'
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.UnauthorizedResponse'
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.NotFoundResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/STUK.APIs.Common.Models.InternalServerErrorResponse'
